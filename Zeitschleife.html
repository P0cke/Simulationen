<html lang="de">
<head>

<title>Escape: Die Zeitschleife – periodische Dezimalbrüche</title>

<style>
:root{--ink:#e9fbff;--muted:#9cc3cc;--accent:#ffb84d;--cyan:#4de1d2;--pink:#ff6fae;--good:#3ddc97;--bad:#ff5d73;--card:rgba(12,38,50,.95);--card2:#164556}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#061218;color:var(--ink);font-family:"Avenir Next","Avenir","Nunito","Segoe UI",system-ui,sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none;overflow-x:hidden}
input{-webkit-user-select:text;user-select:text}
#bg{position:fixed;top:0;left:0;right:0;bottom:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 50% -20%,rgba(77,225,210,.25),rgba(6,18,24,0) 60%),linear-gradient(rgba(77,225,210,.07) 1px,rgba(0,0,0,0) 1px),linear-gradient(90deg,rgba(77,225,210,.07) 1px,rgba(0,0,0,0) 1px),#061218;background-size:auto,44px 44px,44px 44px,auto}
#app{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px 170px}
button{font:inherit;color:inherit;border:none;cursor:pointer;touch-action:manipulation}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:16px 26px;border-radius:18px;font-size:21px;font-weight:800;background:var(--card2);box-shadow:0 5px 0 rgba(0,0,0,.4);margin:4px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.4)}
.btn.go{background:linear-gradient(180deg,#ffd27a,#ffa62e);color:#2a1a00}
.btn.ghost{background:rgba(255,255,255,.08);box-shadow:none;font-size:17px;padding:12px 18px}
.btn small{font-weight:600;opacity:.75;font-size:14px;margin-left:6px}
.btn[disabled]{opacity:.4}
h1,h2{margin:.2em 0}
.muted{color:var(--muted)}
.center{text-align:center}
.ov{border-top:.09em solid currentColor;padding-top:.02em}
.frac{display:inline-block;vertical-align:middle;text-align:center;margin:0 .12em;line-height:1.08;font-weight:800}
.frac>span{display:block;padding:0 .18em}
.frac>span:first-child{border-bottom:.09em solid currentColor}
.mixed{white-space:nowrap}
/* Start */
.hero{text-align:center;padding-top:16px;position:relative}
.hero h1{font-size:clamp(38px,7vw,64px);line-height:1.05;color:var(--accent);text-shadow:0 0 24px rgba(255,184,77,.35)}
.hero .sub{font-size:20px;color:var(--cyan)}
.hero svg.loopy{width:110px}
.hero svg.iko{width:52px;position:absolute;right:6px;top:10px}
.story{background:var(--card);border-radius:24px;padding:22px 26px;max-width:740px;margin:18px auto;font-size:19px;line-height:1.5;border:2px solid rgba(77,225,210,.2)}
.story b{color:var(--accent)}
.namebox{display:flex;justify-content:center;flex-wrap:wrap;margin:16px 0}
.namebox input{font:inherit;font-size:22px;padding:14px 18px;border-radius:16px;border:3px solid #2a6f80;background:#0a2630;color:#fff;width:300px;outline:none;margin:4px}
details.teacher{max-width:740px;margin:24px auto 0;background:rgba(255,255,255,.05);border-radius:16px;padding:12px 18px;font-size:15px;color:var(--muted);line-height:1.5}
details.teacher summary{cursor:pointer;font-weight:700;color:var(--ink)}
/* Map */
.maphead{display:flex;align-items:center;background:var(--card);border-radius:22px;padding:14px 18px;border:2px solid rgba(77,225,210,.2)}
.maphead svg.loopy{width:58px;margin-right:14px;flex:none}
.maphead .rk{flex:1}
.maphead .nm{font-size:22px;font-weight:800}
.xpbar{height:14px;background:#06161d;border-radius:10px;overflow:hidden;margin-top:6px}
.xpbar>div{height:100%;background:linear-gradient(90deg,#ffa62e,#ffd27a);border-radius:10px}
.codepanel{display:flex;align-items:center;flex-wrap:wrap;justify-content:center;background:#06161d;border:2px solid var(--accent);border-radius:18px;padding:12px 16px;margin-top:16px}
.codepanel .lbl{font-weight:800;color:var(--accent);margin-right:12px;font-size:18px}
.cd{display:inline-block;width:46px;height:58px;line-height:58px;text-align:center;border-radius:10px;background:#123b4a;font-size:32px;font-weight:900;margin:3px;font-family:Menlo,Consolas,monospace;color:var(--muted)}
.cd.on{background:var(--accent);color:#2a1a00}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));grid-gap:16px;margin-top:16px}
.rcard{background:var(--card);border-radius:22px;padding:12px 10px 14px;text-align:center;border:2px solid rgba(77,225,210,.15);box-shadow:0 6px 0 rgba(0,0,0,.35)}
.rcard:active{transform:translateY(3px)}
.rcard .rn{font-size:19px;font-weight:800;line-height:1.2}
.rcard .rs{font-size:14px;color:var(--muted);min-height:2.4em;margin-top:2px}
.stars{font-size:24px;letter-spacing:2px;color:#2a5563}
.stars .on{color:var(--accent)}
.rcard.fin{background:linear-gradient(160deg,#3a2a10,#13252c);border-color:var(--accent)}
.rcard.locked{opacity:.55}
.lockinfo{font-size:14px;color:#ffd9a0}
.section{background:var(--card);border-radius:22px;padding:16px 18px;margin-top:18px;border:2px solid rgba(77,225,210,.12)}
.badges{display:flex;flex-wrap:wrap;margin-top:8px}
.badge{display:flex;align-items:center;background:rgba(255,255,255,.06);border-radius:14px;padding:8px 12px;font-size:15px;margin:4px}
.badge .bi{font-size:24px;margin-right:8px}
.badge.off{opacity:.35;filter:grayscale(1)}
.row{display:flex;flex-wrap:wrap;justify-content:center;margin-top:18px}
/* Task */
.topbar{display:flex;align-items:center;margin-bottom:10px}
.topbar .ttl{flex:1;font-weight:800;font-size:19px;margin:0 10px}
.chip{background:rgba(255,255,255,.09);border-radius:30px;padding:8px 14px;font-size:18px;font-weight:700;white-space:nowrap;margin-left:6px}
.chip.hot{background:linear-gradient(90deg,#ff6fae,#ffb84d);color:#2a1000}
.dots{display:flex;justify-content:center;margin:2px 0 12px}
.dots i{width:30px;height:9px;border-radius:5px;background:#1d4b5a;margin:0 4px}
.dots i.cur{background:#fff}.dots i.ok{background:var(--good)}.dots i.no{background:var(--bad)}.dots i.rid{box-shadow:0 0 0 2px #061218,0 0 0 4px var(--accent)}
.stage{display:grid;grid-template-columns:1fr;grid-gap:16px}
@media (min-width:900px) and (orientation:landscape){.stage{grid-template-columns:1.4fr 1fr;align-items:start}}
.card{background:var(--card);border-radius:24px;padding:20px 22px;border:2px solid rgba(77,225,210,.15)}
.card.riddle{border-color:var(--accent);box-shadow:0 0 26px rgba(255,184,77,.22)}
.rtag{display:inline-block;background:linear-gradient(90deg,#ffa62e,#ff6fae);color:#2a1000;font-weight:800;border-radius:12px;padding:5px 12px;font-size:15px;margin-bottom:10px}
.tag{display:inline-block;background:var(--pink);color:#2a0014;border-radius:8px;padding:2px 8px;font-size:14px;font-weight:800;vertical-align:middle}
.prompt{font-size:22px;line-height:1.5}
.bignum{font-size:clamp(40px,6.5vw,60px);font-weight:800;text-align:center;margin:14px 0 4px;line-height:1.3;word-break:break-all}
.bigtxt{font-size:30px;font-weight:800;text-align:center;margin:12px 0 4px;line-height:1.4;word-break:break-word}
.visual{margin-top:14px;text-align:center}
.visual svg{max-width:100%;height:auto}
.hintbox{margin-top:14px;background:rgba(77,225,210,.12);border-left:5px solid var(--cyan);border-radius:12px;padding:10px 14px;font-size:18px;line-height:1.45}
.memo{display:inline-block;background:#fff6d8;color:#3a2a10;border-radius:6px;padding:6px 12px;font-size:18px;transform:rotate(-1.5deg);margin-top:8px;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.hidden{display:none}
/* Division */
.divbox{display:inline-block;background:#06161d;border:2px solid #2a6f80;border-radius:16px;padding:12px 18px;text-align:left;font-family:Menlo,Consolas,monospace}
.divhead{font-size:24px;font-weight:800;color:var(--accent);margin-bottom:6px}
table.steps{border-collapse:collapse;font-size:22px}
table.steps td{padding:4px 8px}
table.steps .q{font-weight:900;color:var(--cyan)}
table.steps .rest{color:var(--muted)}
table.steps tr.ask td{color:var(--accent);font-weight:900}
/* Keypad */
.answer{display:flex;flex-direction:column}
.answer>*{margin-bottom:14px}
.display{display:flex;align-items:center;justify-content:center;background:#06161d;border:3px solid #2a6f80;border-radius:18px;min-height:80px;font-size:40px;font-weight:800;padding:6px 12px;word-break:break-all;text-align:center}
.display .ph{opacity:.35}
.display .pm{font-size:15px;color:var(--accent);margin-left:10px;font-weight:700}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);grid-gap:10px}
.key{height:64px;border-radius:16px;font-size:30px;font-weight:800;background:#1d5466;box-shadow:0 4px 0 rgba(0,0,0,.4)}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.key.cm{background:#2a6f80;font-size:38px;line-height:.6}
.key.del,.key.clr{background:#4a2a3a;font-size:24px}
.key.per{background:#5a3a7c;font-size:18px;line-height:1.1}
.key.per b{display:block;font-size:26px}
.key.per.on{background:var(--accent);color:#2a1a00}
.key.zero{grid-column:span 2}
.choices{display:grid;grid-template-columns:1fr 1fr;grid-gap:12px}
.choices.three{grid-template-columns:1fr 1fr 1fr}
.choice{min-height:84px;border-radius:18px;background:#1d5466;font-size:28px;font-weight:800;box-shadow:0 5px 0 rgba(0,0,0,.4);padding:8px}
.choice:active{transform:translateY(3px)}
.choice.right{background:var(--good);color:#063020}
.choice.wrong{background:var(--bad)}
.actions{display:flex;justify-content:space-between;flex-wrap:wrap}
.actions .go{flex:1;min-width:160px}
/* Sort */
.slots{display:flex;flex-wrap:wrap;min-height:76px;background:#06161d;border:3px dashed #2a6f80;border-radius:18px;padding:6px;align-items:center}
.slots .ph{color:var(--muted);font-size:17px;padding:0 8px}
.slots .lt{font-size:24px;color:var(--muted);margin:0 2px}
.pool{display:flex;flex-wrap:wrap;justify-content:center}
.tile{min-width:96px;height:64px;border-radius:14px;background:#1d5466;font-size:26px;font-weight:800;padding:0 14px;box-shadow:0 4px 0 rgba(0,0,0,.4);margin:5px}
.tile.used{visibility:hidden}
.slots .tile{background:#5a3a7c}
.sortlbl{font-size:17px;color:var(--muted);display:flex;justify-content:space-between}
/* Sheet & Meldungen */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;pointer-events:none;-webkit-transform:translateZ(0)}
.sheet-in{pointer-events:auto;width:100%;max-width:760px;background:#0d2a35;border-radius:26px 26px 0 0;padding:18px 22px max(20px,env(safe-area-inset-bottom));border-top:6px solid var(--good);box-shadow:0 -10px 40px rgba(0,0,0,.55);max-height:62vh;overflow:auto;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(100%)}}
.sheet.bad .sheet-in{border-top-color:var(--bad)}
.fbtitle{font-size:26px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.sheet.ok .fbtitle{color:var(--good)}.sheet.bad .fbtitle{color:var(--bad)}
.fbtitle .xp{color:var(--accent);font-size:22px}
.sol{font-size:22px;margin-top:6px}
.expl{font-size:18px;line-height:1.55;margin:8px 0 14px;color:#d8f3f8}
.sheet .btn{width:100%;margin:0}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:80;background:linear-gradient(90deg,#ffa62e,#ff6fae);color:#2a1000;padding:14px 22px;border-radius:18px;font-size:19px;font-weight:800;box-shadow:0 8px 30px rgba(0,0,0,.45);white-space:nowrap}
.nudge{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:85;background:var(--cyan);color:#062028;font-weight:800;font-size:19px;padding:14px 22px;border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:92vw;text-align:center}
.conf{position:fixed;top:-20px;width:10px;height:16px;z-index:90;border-radius:2px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(112vh) rotate(800deg)}}
/* Finale */
.arena{display:flex;align-items:center}
.arena svg.machine{width:130px;flex:none;margin-right:14px}
.bubble{background:#e9fbff;color:#062028;border-radius:16px;padding:10px 14px;font-size:16px;font-weight:700}
.lives{font-size:22px;margin-top:6px}
.timer{height:8px;background:#06161d;border-radius:6px;overflow:hidden;margin-top:8px}
.timer>div{height:100%;background:var(--cyan);width:100%}
/* Ergebnis */
.result{text-align:center;padding-top:16px}
.bigstars{font-size:76px;letter-spacing:8px}
.bigstars span{color:#2a5563}
.bigstars span.on{color:var(--accent)}
.codeslots{display:flex;justify-content:center;margin:18px 0}
.codeslots .cd{width:62px;height:78px;line-height:78px;font-size:44px;background:#0a2630;border:3px solid #2a6f80;color:var(--ink)}
.codeslots .cd.on{border-color:var(--accent)}
.codepad{display:grid;grid-template-columns:repeat(5,1fr);grid-gap:10px;max-width:520px;margin:0 auto}
/* Zertifikat */
.cert{background:linear-gradient(160deg,#fffaf0,#ffeec7);color:#2a2140;border-radius:24px;padding:30px;max-width:720px;margin:20px auto;border:8px double #c99a2e;text-align:center}
.cert h1{color:#7a4a00;font-size:38px}
.cert table{margin:14px auto;border-collapse:collapse;font-size:19px}
.cert td{padding:6px 14px;border-bottom:1px solid #e3cf9a;text-align:left}
.cert .code{font-family:Menlo,monospace;font-size:22px;letter-spacing:3px;background:#2a2140;color:#ffe07a;display:inline-block;padding:6px 16px;border-radius:10px;margin-top:8px}
.foot{display:flex;align-items:center;justify-content:center;margin:34px auto 0;color:var(--muted);font-size:14px;text-align:center}
.foot svg.iko{width:34px;height:34px;flex:none;margin-right:10px}
.cert .foot{color:#6a5a40;margin-top:16px}
.mute{position:fixed;right:14px;bottom:14px;z-index:40;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.1);font-size:24px}
</style>

<body>
<div id="bg"></div>
<div id="app"></div>
<button class="mute" id="muteBtn" aria-label="Ton an/aus">🔊</button>
<script>
"use strict";
/* ================= Grundlagen ================= */
var KEY='zeitschleife_v1';
const $=s=>document.querySelector(s);
const app=$('#app');
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
const pow10=k=>Math.pow(10,k);
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a;}
function R(n,d){const g=gcd(n,d)||1;return {n:n/g,d:d/g};}
const eq=(x,y)=>x.n===y.n&&x.d===y.d;
const cmp=(x,y)=>x.n*y.d-y.n*x.d;
// Dezimalentwicklung per schriftlicher Division: {I, pre (Vorperiode), per (Periode)}
function dec(n,d){const I=Math.floor(n/d);let r=n%d;const seen={},ds=[];while(r!==0&&seen[r]===undefined){seen[r]=ds.length;r*=10;ds.push(Math.floor(r/d));r%=d;}
 if(r===0)return {I:String(I),pre:ds.join(''),per:''};const s=seen[r];return {I:String(I),pre:ds.slice(0,s).join(''),per:ds.slice(s).join('')};}
function partsHTML(p){return p.I+((p.pre||p.per)?','+p.pre+(p.per?`<span class="ov">${p.per}</span>`:''):'');}
const dh=(n,d)=>partsHTML(dec(n,d));
const rh=r=>dh(r.n,r.d);
function partsRat(p){const a=p.pre.length,b=p.per.length;const base=(+p.I)*pow10(a)+(a?+p.pre:0);if(!b)return R(base,pow10(a));const m=pow10(b)-1;return R(base*m+(+p.per),pow10(a)*m);}
function P(s){const parts=s.split(',');const rest=parts[1]||'';const q=rest.split('|');return {I:parts[0],pre:q[0]||'',per:q[1]||''};}
function digitsFrom(p,k){let s=p.pre;while(s.length<k&&p.per)s+=p.per;return s.slice(0,k).padEnd(k,'0');}
function expStr(r,k){const p=dec(r.n,r.d);return p.I+','+digitsFrom(p,k)+(p.per?'…':'');}
function isTerm(n,d){d=d/gcd(n,d);while(d%2===0)d/=2;while(d%5===0)d/=5;return d===1;}
function factors(n){const f=[];for(let p=2;p*p<=n;p++)while(n%p===0){f.push(p);n/=p;}if(n>1)f.push(n);return f;}
const frac=(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const fr=r=>r.d===1?String(r.n):frac(r.n,r.d);
const PROFI=' <span class="tag">Profi</span>';
const ovs=(a,b)=>`${a}<span class="ov">${b}</span>`;

let S=load()||fresh();
function fresh(){return {name:'',xp:0,stars:{},badges:[],riddles:0,finaleWon:false,escaped:false,bestCombo:0};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));return d&&typeof d==='object'?Object.assign(fresh(),d):null;}catch(e){return null;}}

/* ================= Ton ================= */
let AC=null,muted=false;
function beep(fs,dur,type,vol){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const t=AC.currentTime;fs.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;const s=t+i*dur;g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(vol||0.16,s+0.015);g.gain.exponentialRampToValueAtTime(0.0001,s+dur);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+dur+0.03);});}catch(e){}}
const sfx={ok:()=>beep([660,880,1320],.09),bad:()=>beep([240,170],.17,'square',.06),tap:()=>beep([560],.035,'sine',.08),win:()=>beep([523,659,784,1046,1318],.12),zap:()=>beep([300,600,1200],.07,'sawtooth',.06),door:()=>beep([196,262,392,523,784],.16,'triangle',.14)};
$('#muteBtn').addEventListener('click',()=>{muted=!muted;$('#muteBtn').textContent=muted?'🔇':'🔊';});

/* ================= Grafiken ================= */

function parseTok(tok){let I='',pre='',per='',comma=false;for(const x of tok){if(x.c){comma=true;continue;}if(!comma)I+=x.d;else if(x.p)per+=x.d;else pre+=x.d;}return {I,pre,per,comma};}
function updDisp(){const d=$('#disp');if(!d)return;const q=parseTok(cur.tok);let s='';
 if(cur.tok.length){s=q.I+(q.comma?','+q.pre+(q.per?`<span class="ov">${q.per}</span>`:''):'');}
 d.innerHTML=(s?`<span>${s}</span>`:'<span class="ph">?</span>')+(cur.pm?'<span class="pm">‾ Periode an</span>':'');
 const pk=$('#perKey');if(pk)pk.classList.toggle('on',cur.pm);}
function key(k){if(cur.answered)return;const tok=cur.tok;const q=parseTok(tok);
 if(k==='⌫'){tok.pop();if(!tok.some(x=>x.p))cur.pm=cur.pm&&tok.some(x=>x.c);}
 else if(k==='C'){cur.tok=[];cur.pm=false;}
 else if(k===','){if(q.comma)return;if(!q.I)tok.push({d:'0'});tok.push({c:true});}
 else if(k==='P'){if(!q.comma){nudge('Die Periode steht immer hinter dem Komma – tippe zuerst ein Komma.');return;}cur.pm=!cur.pm;}
 else{if(q.per&&!cur.pm){nudge('Nach der Periode kommt keine Ziffer mehr. Tippe ‾ oder ⌫.');return;}
  if(!q.comma&&q.I.length>=4)return;if(q.comma&&q.pre.length+q.per.length>=10)return;
  if(!q.comma&&q.I==='0'){tok.pop();}
  tok.push({d:k,p:cur.pm&&q.comma});}
 updDisp();sfx.tap();}
function drawSort(){const t=run.tasks[run.i];$('#slots').innerHTML=cur.seq.length?cur.seq.map((idx,k)=>`<button class="tile" data-s="${k}">${t.items[idx].s}</button>`).join(`<span class="lt">${t.asc?'&lt;':'&gt;'}</span>`):'<span class="ph">Hier entsteht deine Reihe …</span>';
 $('#pool').innerHTML=t.items.map((it,i)=>`<button class="tile ${cur.seq.indexOf(i)>=0?'used':''}" data-t="${i}">${it.s}</button>`).join('');}
function shakeEl(sel){const el=$(sel);if(!el)return;el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');}

function check(){const t=run.tasks[run.i];if(cur.answered)return;let ok=false;
 if(t.type==='input'){const q=parseTok(cur.tok);if(!q.I){shakeEl('#disp');nudge('✏️ Tippe zuerst deine Antwort ins Zahlenfeld.');return;}
  if(t.check)ok=t.check(q);else ok=eq(partsRat(q),t.answer);}
 else if(t.type==='sort'){if(cur.seq.length<t.items.length){shakeEl('#slots');const f=t.items.length-cur.seq.length;nudge(`👆 Lege erst alle Zahlen in die Reihe – es ${f===1?'fehlt':'fehlen'} noch ${f}.`);return;}ok=cur.seq.every((idx,k)=>eq(t.items[idx].r,t.order[k].r));}
 resolve(ok);}
function choose(i){const t=run.tasks[run.i];if(cur.answered)return;const ok=t.choices[i].ok;document.querySelectorAll('.choice').forEach((b,k)=>{if(t.choices[k].ok)b.classList.add('right');else if(k===i)b.classList.add('wrong');});resolve(ok);}
function resolve(ok){cur.answered=true;stopTimer();const t=run.tasks[run.i];const fin=run.mode==='finale';let gain=0,extra='';run.res[run.i]=ok;
 if(ok){run.correct++;run.streak++;if(run.streak>S.bestCombo)S.bestCombo=run.streak;gain=(t.riddle?25:10)+Math.min(10,(run.streak-1)*2);
  if(fin&&run.timeLeft>0){gain+=5;extra='⚡ Tempo-Bonus! ';}
  if(t.riddle){S.riddles++;confetti(12);}
  if(fin){const add=run.streak>=3?2:1;run.energy=Math.min(run.need,run.energy+add);const e=$('#energy');if(e){const c=2*Math.PI*52;e.setAttribute('stroke-dashoffset',(c*(1-run.energy/run.need)).toFixed(1));}const en=$('#en');if(en)en.textContent=Math.round(run.energy/run.need*100)+' %';extra+=`🔋 +${add*10} % Energie!`;sfx.zap();setTimeout(sfx.ok,160);}else sfx.ok();
 }else{run.streak=0;sfx.bad();if(fin){run.lives--;const l=$('#lives');if(l)l.textContent='Zeitschleifen übrig: '+'♾️'.repeat(run.lives)+'✖️'.repeat(3-run.lives);extra='⏪ Die Zeit springt zurück – eine Schleife verbraucht!';}}
 S.xp+=gain;save();
 if(run.streak===5)award('combo5');if(run.streak===10)award('combo10');if(S.riddles>=3)award('riddle3');
 const xv=$('#xpv');if(xv)xv.textContent=S.xp;const sk=$('#stk');if(sk){sk.textContent='🔁 '+run.streak;sk.classList.toggle('hot',run.streak>=3);}
 const praise=pick(['Richtig!','Volltreffer!','Klasse!','Stark!','Genau so!','Perfekt!']);
 const sol=t.solution||(t.answer?rh(t.answer):'');
 const el=document.createElement('div');el.className='sheet '+(ok?'ok':'bad');
 el.innerHTML=`<div class="sheet-in"><div class="fbtitle"><span>${ok?'✅ '+praise+(run.streak>=3?` 🔁 Serie ×${run.streak}`:''):'❌ Leider nicht.'}</span>${gain?`<span class="xp">+${gain} XP</span>`:''}</div>${extra?`<div class="sol">${extra}</div>`:''}${!ok&&t.type==='input'?`<div class="sol">Richtig wäre: <b>${sol}</b></div>`:''}${!ok&&t.type==='sort'?`<div class="sol">Richtig: <b>${t.solution}</b></div>`:''}<div class="expl">${t.explain}</div><button class="btn go" data-a="next">Weiter ➜</button></div>`;
 document.body.appendChild(el);void el.offsetHeight;}
function hint(){const hb=$('#hintbox');if(!hb||!hb.classList.contains('hidden'))return;hb.classList.remove('hidden');run.hintUsed=true;S.xp=Math.max(0,S.xp-5);save();const xv=$('#xpv');if(xv)xv.textContent=S.xp;const b=$('#hintBtn');if(b)b.disabled=true;}
function next(){if(run.mode==='finale'){if(run.energy>=run.need)return finaleEnd(true);if(run.lives<=0)return finaleEnd(false);run.tasks.push(finaleTask(run.tasks.length));run.i++;return renderTask();}
 run.i++;if(run.i>=run.tasks.length)roomEnd();else renderTask();}

function roomEnd(){const Rm=run.Rm,c=run.correct,n=run.tasks.length;const st=c>=7?3:c>=5?2:c>=3?1:0;const wasUnl=finaleUnlocked();const had=(S.stars[Rm.id]||0)>=1;S.stars[Rm.id]=Math.max(S.stars[Rm.id]||0,st);save();
 if(st>0)award('first');if(c===n)award('perfect');if(st===3&&!run.hintUsed)award('nohint');if(ROOMS.every(p=>S.stars[p.id]===3))award('allstars');
 const idx=ROOMS.indexOf(Rm);const newDigit=st>0&&!had;
 const msg=st===3?'Großartig! Diese Tür steht sperrangelweit offen!':st===2?'Tür geöffnet! Schaffst du beim nächsten Versuch drei Sterne?':st===1?'Die Tür klemmt noch etwas, aber sie ist auf!':'Die Tür bleibt zu … Nutze die Tipps und versuch es nochmal!';
 if(st===3){sfx.door();confetti(36);}else if(st>0)sfx.door();
 const xpGain=S.xp-run.xp0;run=null;
 show(`<div class="result">${doorSVG(Rm,st)}<h1>${Rm.name}${st?' geöffnet!':''}</h1><div class="bigstars">${[1,2,3].map(k=>`<span class="${k<=st?'on':''}">★</span>`).join('')}</div>
 <div style="font-size:24px;margin:10px 0"><b>${c} von ${n}</b> richtig · <span style="color:var(--accent)">+${xpGain} XP</span></div><div class="muted" style="font-size:19px">${msg}</div>
 ${newDigit?`<div class="story center">🔐 Hinter der Tür klebt ein Zettel mit einer Ziffer des Fluchtcodes: <span class="cd on" style="width:56px">${CODE[idx]}</span></div>`:''}
 ${!wasUnl&&finaleUnlocked()?'<div class="story center">⚡ <b>Die Zeitmaschine ist bereit!</b> Du kannst sie jetzt im Laborplan starten.</div>':''}
 <div class="row"><button class="btn go" data-a="map">🧪 Zum Laborplan</button><button class="btn" data-a="room" data-p="${Rm.id}">🔁 Nochmal (neue Aufgaben)</button></div></div>`);}
function finaleEnd(win){const gained=S.xp-run.xp0;run=null;
 if(win){S.finaleWon=true;S.xp+=50;save();sfx.win();renderCode('⚡ Die Zeitmaschine ist voll geladen! (+50 XP) Jetzt fehlt nur noch der Fluchtcode …');return;}
 show(`<div class="result"><div style="width:150px;margin:0 auto">${machineSVG(0)}</div><h1>⏪ Die Zeit springt zurück …</h1><div class="story">Alle Zeitschleifen sind verbraucht, die Maschine hat nicht genug Energie. Aber keine Sorge – in einer Zeitschleife darf man es immer wieder versuchen! (+${gained} XP gesammelt)</div>
 <div class="row"><button class="btn go" data-a="finale">⚡ Neuer Versuch</button><button class="btn" data-a="map">🧪 Laborplan</button></div></div>`);}
function renderCode(msg){run=null;cur={code:'',tries:cur&&cur.tries||0};
 const known=CODE.map((c,i)=>i<5&&(S.stars[ROOMS[i].id]||0)>=1?c:'?').join(' ');
 show(`<div class="result">${LOOPY.replace('class="loopy"','class="loopy" style="width:110px"')}<h1>🔐 Der Fluchtcode</h1>${msg?`<div class="story center">${msg}</div>`:''}
 <div class="story">Die Tür der Zeitmaschine verlangt einen <b>6-stelligen Code</b>. Deine gefundenen Ziffern: <b style="font-family:Menlo,monospace;font-size:24px">${known}</b><br>Die letzte Ziffer musst du selbst herausfinden. LOOPY flüstert: <i>„Professorin Periodika liebt eine ganz bestimmte Periode …“</i></div>
 <div class="codeslots" id="codeslots"></div>
 <div class="codepad">${['1','2','3','4','5','6','7','8','9','0'].map(k=>`<button class="key" data-cd="${k}">${k}</button>`).join('')}</div>
 <div class="row"><button class="btn ghost" data-cd="⌫">⌫ Löschen</button><button class="btn go" data-a="opencode">🚪 Tür öffnen</button></div>
 <div class="row"><button class="btn ghost" data-a="map">🧪 Laborplan</button></div></div>`);drawCode();}
function drawCode(){const s=$('#codeslots');if(!s)return;let h='';for(let i=0;i<6;i++)h+=`<span class="cd ${cur.code[i]?'on':''}">${cur.code[i]||''}</span>`;s.innerHTML=h;}
function codeKey(k){if(k==='⌫')cur.code=cur.code.slice(0,-1);else if(cur.code.length<6)cur.code+=k;sfx.tap();drawCode();}
function openCode(){if(cur.code.length<6){nudge('Der Code hat 6 Ziffern.');shakeEl('#codeslots');return;}
 if(cur.code===CODE.join('')){S.escaped=true;save();award('escape');return escapeScreen();}
 cur.tries++;sfx.bad();shakeEl('#codeslots');cur.code='';drawCode();
 const tips=['❌ Falsch! Tipp: Alle Ziffern zusammen sind die Periode eines Bruchs mit dem Zähler 1.','❌ Noch nicht! Tipp: Der Nenner ist 7. Rechne 1 : 7 schriftlich!',`❌ LOOPY verrät es dir: ${frac(1,7)} = ${dh(1,7)}`];
 const el=document.createElement('div');el.className='sheet bad';el.innerHTML=`<div class="sheet-in"><div class="fbtitle"><span>${tips[Math.min(cur.tries,3)-1]}</span></div><button class="btn go" data-a="closesheet" style="margin-top:12px">Nochmal versuchen</button></div>`;document.body.appendChild(el);}
function escapeScreen(){sfx.win();confetti(45);
 show(`<div class="result"><div style="font-size:90px">🚪✨</div><h1>Ausgebrochen!</h1><div class="story">Die Tür springt auf, die Uhren ticken wieder normal – die Zeitschleife ist durchbrochen! Professorin Periodika ist begeistert, <b>${esc(S.name)}</b>.<br><br>Hast du es bemerkt? Der Fluchtcode <b>142857</b> ist genau die Periode von ${frac(1,7)} = ${dh(1,7)}.<br>🤓 Knobel-Bonus: Rechne mal ${frac(2,7)}, ${frac(3,7)} … – was passiert mit den Ziffern?</div>
 <div class="row"><button class="btn go" data-a="cert">📜 Zertifikat ansehen</button><button class="btn" data-a="map">🧪 Laborplan</button></div></div>`);}

function renderCert(){run=null;const rk=rankOf(S.xp);const totalStars=ROOMS.reduce((s,p)=>s+(S.stars[p.id]||0),0);
 let hsh=11;const str=S.name+'|'+S.xp+'|'+totalStars+'|'+S.badges.length+'|'+(S.escaped?1:0);for(const ch of str)hsh=(hsh*31+ch.charCodeAt(0))%1679616;const code='ZS-'+hsh.toString(36).toUpperCase().padStart(4,'0');
 show(`<div class="cert"><div style="font-size:50px">⏰</div><h1>Labor-Zertifikat</h1><div style="font-size:19px">Hiermit wird bestätigt, dass</div><div style="font-size:36px;font-weight:800;margin:6px 0">${esc(S.name)}</div><div style="font-size:19px">im Escape-Room <b>„Die Zeitschleife“</b> den Rang</div><div style="font-size:28px;font-weight:800;color:#7a4a00;margin:6px 0">${rk.name}</div><div style="font-size:19px">erreicht hat.</div>
 <table>${ROOMS.map(p=>`<tr><td>${p.name}</td><td>${'⭐'.repeat(S.stars[p.id]||0)||'–'}</td></tr>`).join('')}<tr><td>Zeitschleife</td><td>${S.escaped?'🚪 entkommen':S.finaleWon?'⚡ Maschine geladen':'noch gefangen'}</td></tr><tr><td>Abzeichen</td><td>${S.badges.map(b=>BADGES[b][0]).join(' ')||'–'} (${S.badges.length}/${Object.keys(BADGES).length})</td></tr><tr><td>Erfahrung</td><td><b>${S.xp} XP</b> · beste Serie: ${S.bestCombo}</td></tr></table>
 <div>${new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div><div class="code">${code}</div><div style="font-size:14px;margin-top:6px">Zeige dieses Zertifikat deiner Lehrkraft.</div>${FOOT}</div>
 <div class="row"><button class="btn go" data-a="map">🧪 Zurück zum Laborplan</button></div>`);}

/* ================= Steuerung ================= */
function act(a,b){
 switch(a){
 case 'go':{const v=($('#nm')||{}).value;const name=(v||'').trim();if(!name){shakeEl('#nm');nudge('Gib zuerst deinen Namen ein.');return;}S.name=name.slice(0,20);save();sfx.win();renderMap();break;}
 case 'map':if(run&&run.mode==='room'&&run.i>0&&!confirm('Raum verlassen? Dieser Versuch wird nicht gewertet (XP bleiben).'))return;renderMap();break;
 case 'home':renderStart();break;
 case 'reset':if(confirm('Wirklich neu starten? Alle Sterne, XP und Abzeichen auf diesem iPad werden gelöscht.')){S=fresh();save();renderStart();}break;
 case 'room':startRoom(b.getAttribute('data-p'));break;
 case 'finale':startFinale();break;
 case 'cert':renderCert();break;
 case 'check':check();break;
 case 'hint':hint();break;
 case 'next':next();break;
 case 'opencode':openCode();break;
 case 'closesheet':document.querySelectorAll('.sheet').forEach(e=>e.remove());break;}}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button');if(!b||b.id==='muteBtn')return;
 const a=b.getAttribute('data-a');if(a)return act(a,b);
 const k=b.getAttribute('data-k');if(k!=null)return key(k);
 const cd=b.getAttribute('data-cd');if(cd!=null)return codeKey(cd);
 const c=b.getAttribute('data-c');if(c!=null)return choose(+c);
 const ti=b.getAttribute('data-t');if(ti!=null){if(cur.answered)return;const i=+ti;if(cur.seq.indexOf(i)<0){cur.seq.push(i);sfx.tap();drawSort();}return;}
 const si=b.getAttribute('data-s');if(si!=null){if(cur.answered)return;cur.seq.splice(+si,1);drawSort();}});
document.addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;
 if(cur&&cur.code!==undefined&&!run){if(/^[0-9]$/.test(e.key))codeKey(e.key);else if(e.key==='Backspace')codeKey('⌫');else if(e.key==='Enter')openCode();return;}
 if(!run||!cur)return;const t=run.tasks[run.i];
 if(cur.answered){if(e.key==='Enter'){e.preventDefault();next();}return;}
 if(t.type==='input'){if(/^[0-9]$/.test(e.key))key(e.key);else if(e.key===','||e.key==='.')key(',');else if(e.key==='p'||e.key==='P')key('P');else if(e.key==='Backspace'){e.preventDefault();key('⌫');}else if(e.key==='Enter')check();}
 else if(t.type==='choice'&&/^[1-4]$/.test(e.key)&&t.choices[+e.key-1])choose(+e.key-1);
 else if(e.key==='Enter')check();});

renderStart();
</script>
</body>
</html>
