<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mission Komma – Die Dezimalzahlen-Expedition</title>
<meta name="author" content="Stephan Holtkötter">
<!-- © 2026 Stephan Holtkötter. Alle Rechte vorbehalten. -->
<style>
:root{--bg:#0b1030;--card:rgba(24,32,84,.92);--card2:#222c6e;--ink:#eef1ff;--muted:#a9b1e6;--accent:#ffd34d;--good:#3ddc97;--bad:#ff5d73;--blue:#5ac8fa;--violet:#9a7bff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#05071a;color:var(--ink);font-family:"Avenir Next","Avenir","Nunito","Segoe UI",system-ui,sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none;overflow-x:hidden}
input{-webkit-user-select:text;user-select:text}
#sky{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:0;overflow:hidden;background:radial-gradient(ellipse at 50% -10%,#28308a 0%,#121848 45%,#05071a 100%)}
.tw1{animation:tw 4s infinite ease-in-out}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
#app{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px 160px}
button{font:inherit;color:inherit;border:none;cursor:pointer;touch-action:manipulation}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:16px 26px;border-radius:18px;font-size:21px;font-weight:800;background:var(--card2);box-shadow:0 5px 0 rgba(0,0,0,.35);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn.go{background:linear-gradient(180deg,#ffe07a,#ffb52e);color:#2a1a00}
.btn.ghost{background:rgba(255,255,255,.08);box-shadow:none;font-size:17px;padding:12px 18px}
.btn small{font-weight:600;opacity:.75;font-size:14px}
.btn[disabled]{opacity:.4}
h1,h2,h3{margin:.2em 0}
.center{text-align:center}
.muted{color:var(--muted)}
/* Start */
.hero{text-align:center;padding-top:20px}
.hero h1{font-size:clamp(40px,7vw,68px);letter-spacing:1px;background:linear-gradient(90deg,#ffe07a,#ff8f6b,#c48bff);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.05}
.hero .rocket{width:120px;animation:hover 2.4s ease-in-out infinite}
@keyframes hover{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-12px) rotate(4deg)}}
.story{background:var(--card);border-radius:24px;padding:22px 26px;max-width:720px;margin:18px auto;font-size:19px;line-height:1.5;text-align:left;border:2px solid rgba(255,255,255,.07)}
.story b{color:var(--accent)}
.namebox{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.namebox input{font:inherit;font-size:22px;padding:14px 18px;border-radius:16px;border:3px solid #3a4596;background:#10164a;color:#fff;width:300px;outline:none}
.namebox input:focus{border-color:var(--accent)}
details.teacher{max-width:720px;margin:26px auto 0;background:rgba(255,255,255,.05);border-radius:16px;padding:12px 18px;font-size:15px;color:var(--muted);line-height:1.5}
details.teacher summary{cursor:pointer;font-weight:700;color:var(--ink)}
/* Map */
.maphead{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:22px;padding:14px 18px;border:2px solid rgba(255,255,255,.07)}
.maphead .rk{flex:1}
.maphead .rk .nm{font-size:22px;font-weight:800}
.xpbar{height:14px;background:#0d1240;border-radius:10px;overflow:hidden;margin-top:6px}
.xpbar>div{height:100%;background:linear-gradient(90deg,#ffb52e,#ffe07a);border-radius:10px;transition:width .6s}
.planets{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-top:18px}
.pcard{background:var(--card);border-radius:24px;padding:14px 10px 16px;text-align:center;border:2px solid rgba(255,255,255,.07);position:relative;box-shadow:0 6px 0 rgba(0,0,0,.3)}
.pcard:active{transform:translateY(3px)}
.pcard .planet{animation:float 4s ease-in-out infinite}
.pcard:nth-child(2) .planet{animation-delay:-1s}.pcard:nth-child(3) .planet{animation-delay:-2s}.pcard:nth-child(4) .planet{animation-delay:-3s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.pcard .pn{font-size:22px;font-weight:800}
.pcard .ps{font-size:14px;color:var(--muted);min-height:2.4em}
.stars{font-size:26px;letter-spacing:2px;color:#4b5396}
.stars .on{color:var(--accent);text-shadow:0 0 10px rgba(255,211,77,.6)}
.pcard.boss{background:linear-gradient(160deg,#3a1a6b,#1a1040);border-color:#9a7bff}
.pcard.locked{filter:grayscale(.85);opacity:.6}
.lockinfo{font-size:14px;color:#d8c9ff}
.badges{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.badge{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border-radius:14px;padding:8px 12px;font-size:15px}
.badge .bi{font-size:24px}
.badge.off{opacity:.35;filter:grayscale(1)}
.section{background:var(--card);border-radius:22px;padding:16px 18px;margin-top:18px;border:2px solid rgba(255,255,255,.07)}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:18px}
/* Task */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.topbar .ttl{flex:1;font-weight:800;font-size:19px}
.chip{background:rgba(255,255,255,.09);border-radius:30px;padding:8px 14px;font-size:18px;font-weight:700;white-space:nowrap}
.chip.hot{background:linear-gradient(90deg,#ff6b3d,#ffb52e);color:#2a1000;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.dots{display:flex;gap:8px;justify-content:center;margin:2px 0 12px}
.dots i{width:30px;height:9px;border-radius:5px;background:#2a3373}
.dots i.cur{background:#fff}.dots i.ok{background:var(--good)}.dots i.no{background:var(--bad)}.dots i.rid{outline:2px solid #c48bff;outline-offset:2px}
.stage{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:900px) and (orientation:landscape){.stage{grid-template-columns:1.4fr 1fr;align-items:start}}
.card{background:var(--card);border-radius:24px;padding:20px 22px;border:2px solid rgba(255,255,255,.07)}
.card.riddle{border-color:#c48bff;box-shadow:0 0 30px rgba(196,139,255,.25)}
.rtag{display:inline-block;background:linear-gradient(90deg,#9a3dff,#ff8fd1);color:#fff;font-weight:800;border-radius:12px;padding:5px 12px;font-size:15px;margin-bottom:10px}
.tag{display:inline-block;background:#ff6b3d;color:#fff;border-radius:8px;padding:2px 8px;font-size:14px;vertical-align:middle}
.prompt{font-size:22px;line-height:1.45}
.bignum{font-size:clamp(44px,7vw,64px);font-weight:800;text-align:center;margin:14px 0 4px;letter-spacing:1px}
.bignum .hl{color:var(--accent);text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:8px}
.bigtxt{font-size:28px;font-weight:800;text-align:center;margin:14px 0 4px;line-height:1.4}
.visual{margin-top:14px;text-align:center}
.visual svg{max-width:100%;height:auto}
.emoji{font-size:30px;vertical-align:middle}
.hintbox{margin-top:14px;background:rgba(90,200,250,.12);border-left:5px solid var(--blue);border-radius:12px;padding:10px 14px;font-size:18px;line-height:1.4}
.hidden{display:none}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .12em;line-height:1.08;font-weight:800}
.frac>span:first-child{border-bottom:3px solid currentColor;padding:0 .18em}
.mixed{display:inline-flex;align-items:center;gap:2px}
/* place value table */
table.pt{border-collapse:separate;border-spacing:0;margin:6px auto;font-size:30px;font-weight:800;border-radius:14px;overflow:hidden}
table.pt th{background:#2f3a8c;padding:8px 18px;font-size:22px}
table.pt th.dec{background:#5a3a9c}
table.pt td{background:#141b55;padding:12px 18px;min-width:62px;text-align:center;border-top:2px solid #3a4596}
table.pt td+td,table.pt th+th{border-left:2px solid #3a4596}
table.pt .cm{border-left:5px solid var(--bad)!important}
/* answer area */
.answer{display:flex;flex-direction:column;gap:14px}
.display{display:flex;align-items:center;justify-content:center;gap:10px;background:#0d1240;border:3px solid #3a4596;border-radius:18px;height:78px;font-size:42px;font-weight:800}
.display .ph{opacity:.35}
.display.shake,.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.display .unit{color:var(--muted);font-size:30px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{height:66px;border-radius:16px;font-size:30px;font-weight:800;background:#283380;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35);background:#3a47a8}
.key.comma{background:#5a3a9c;font-size:38px;line-height:.6}
.key.del{background:#4a2a50}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choices.three{grid-template-columns:1fr 1fr 1fr}
.choice{min-height:84px;border-radius:18px;background:#283380;font-size:30px;font-weight:800;box-shadow:0 5px 0 rgba(0,0,0,.35);padding:8px}
.choice:active{transform:translateY(3px)}
.choice.right{background:var(--good);color:#063020}
.choice.wrong{background:var(--bad)}
.actions{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.actions .go{flex:1;min-width:160px}
/* sort */
.slots{display:flex;flex-wrap:wrap;gap:10px;min-height:76px;background:#0d1240;border:3px dashed #3a4596;border-radius:18px;padding:10px;align-items:center}
.slots .ph{color:var(--muted);font-size:17px;padding:0 8px}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tile{min-width:96px;height:62px;border-radius:14px;background:#283380;font-size:26px;font-weight:800;padding:0 14px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.tile.used{visibility:hidden}
.slots .tile{background:#5a3a9c}
.sortlbl{font-size:17px;color:var(--muted);display:flex;justify-content:space-between}
/* number line */
svg.nl{width:100%;height:auto;touch-action:none}
.nltxt{font-size:24px;font-weight:800;fill:#eef1ff}
/* feedback sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;pointer-events:none;-webkit-transform:translateZ(0)}
@keyframes up{from{transform:translateY(100%)}}
.sheet-in{pointer-events:auto;animation:up .25s ease-out;width:min(760px,100%);background:#141a4d;border-radius:26px 26px 0 0;padding:18px 22px max(20px,env(safe-area-inset-bottom));border-top:6px solid var(--good);box-shadow:0 -10px 40px rgba(0,0,0,.5);max-height:60vh;overflow:auto}
.sheet.bad .sheet-in{border-top-color:var(--bad)}
.fbtitle{font-size:26px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.sheet.ok .fbtitle{color:var(--good)}.sheet.bad .fbtitle{color:var(--bad)}
.fbtitle .xp{color:var(--accent);font-size:22px}
.sol{font-size:21px;margin-top:6px}
.expl{font-size:18px;line-height:1.5;margin:8px 0 14px;color:#dfe3ff}
.sheet .btn{width:100%}
/* toast */
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:80;background:linear-gradient(90deg,#9a3dff,#ff6b9d);padding:14px 22px;border-radius:18px;font-size:19px;font-weight:800;box-shadow:0 8px 30px rgba(0,0,0,.4);animation:toast 3.2s forwards;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-30px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-20px)}}
.conf{position:fixed;top:-20px;width:10px;height:16px;z-index:90;border-radius:2px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(112vh) rotate(800deg)}}
/* boss */
.arena{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.arena svg.bossfig{width:120px;flex:none}
.arena svg.bossfig.hit{animation:hit .5s}
@keyframes hit{0%{filter:brightness(3)}30%{transform:translateX(-10px) rotate(-8deg)}60%{transform:translateX(10px) rotate(6deg)}100%{filter:none}}
.bubble{background:#fff;color:#1a1440;border-radius:16px;padding:10px 14px;font-size:16px;font-weight:700;position:relative}
.bubble:before{content:"";position:absolute;left:-10px;top:18px;border:6px solid transparent;border-right:10px solid #fff}
.hp{height:18px;background:#2a1440;border-radius:10px;overflow:hidden;margin-top:8px;border:2px solid #9a7bff}
.hp>div{height:100%;background:linear-gradient(90deg,#ff5d73,#ff9f43);transition:width .5s}
.lives{font-size:24px;margin-top:6px}
.timer{height:8px;background:#0d1240;border-radius:6px;overflow:hidden;margin-top:8px}
.timer>div{height:100%;background:var(--blue);width:100%;transition:width .1s linear}
/* results */
.result{text-align:center;padding-top:20px}
.bigstars{font-size:76px;letter-spacing:8px}
.bigstars span{display:inline-block;color:#3a4280;animation:pop .5s backwards}
.bigstars span.on{color:var(--accent);text-shadow:0 0 24px rgba(255,211,77,.7)}
.bigstars span:nth-child(2){animation-delay:.25s}.bigstars span:nth-child(3){animation-delay:.5s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
/* certificate */
.cert{background:linear-gradient(160deg,#fffaf0,#ffeec7);color:#2a2140;border-radius:24px;padding:30px;max-width:720px;margin:20px auto;border:8px double #c99a2e;text-align:center}
.cert h1{color:#7a4a00;font-size:40px}
.cert table{margin:14px auto;border-collapse:collapse;font-size:19px}
.cert td{padding:6px 14px;border-bottom:1px solid #e3cf9a;text-align:left}
.cert .code{font-family:Menlo,monospace;font-size:22px;letter-spacing:3px;background:#2a2140;color:#ffe07a;display:inline-block;padding:6px 16px;border-radius:10px;margin-top:8px}
.foot{display:flex;align-items:center;justify-content:center;gap:10px;margin:34px auto 0;color:var(--muted);font-size:14px;text-align:center}
.foot svg.iko{width:34px;height:34px;flex:none}
.hero svg.iko{width:56px;position:absolute;right:6px;top:10px;animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cert .foot{color:#6a5a40;margin-top:16px}
.nudge{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:85;background:#ff9f43;color:#2a1000;font-weight:800;font-size:19px;padding:14px 22px;border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.45);max-width:92vw;text-align:center;animation:nud .25s ease-out}
@keyframes nud{from{opacity:0;transform:translate(-50%,20px)}}
svg.nl#tapline{cursor:pointer}
.mute{position:fixed;right:14px;bottom:14px;z-index:40;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.1);font-size:24px}
</style>
</head>
<body>
<div id="sky"></div>
<div id="app"></div>
<button class="mute" id="muteBtn" aria-label="Ton an/aus">🔊</button>
<script>
"use strict";
/* ================= Grundlagen ================= */
const KEY='missionKomma_v1';
const $=s=>document.querySelector(s);
const app=$('#app');
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
// Alle Zahlen intern als ganze Zahlen in Tausendsteln (keine Rundungsfehler!)
function fmt(m){const i=Math.floor(m/1000);const f=String(m%1000).padStart(3,'0').replace(/0+$/,'');return f?i+','+f:String(i);}
function fmtF(m,d){const i=Math.floor(m/1000);return d===0?String(i):i+','+String(m%1000).padStart(3,'0').slice(0,d);}
function parseNum(s){s=String(s).trim().replace('.',',');if(!/^\d+(,\d{0,3})?$/.test(s))return NaN;const [a,b='']=s.split(',');return parseInt(a,10)*1000+parseInt((b+'000').slice(0,3),10);}
const frac=(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const PL=[{n:'Einer',v:1000},{n:'Zehntel',v:100},{n:'Hundertstel',v:10},{n:'Tausendstel',v:1}];
function toDec(a,b){const T=[10,100,1000].find(T=>T%b===0);const k=T/b;return {T,k,val:a*k*(1000/T)};}

let S=load()||fresh();
function fresh(){return {name:'',xp:0,stars:{},badges:[],riddles:0,bossWon:false,bestCombo:0};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));return d&&typeof d==='object'?Object.assign(fresh(),d):null;}catch(e){return null;}}

/* ================= Ton ================= */
let AC=null,muted=false;
function beep(fs,dur,type,vol){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const t=AC.currentTime;fs.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;const s=t+i*dur;g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(vol||0.16,s+0.015);g.gain.exponentialRampToValueAtTime(0.0001,s+dur);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+dur+0.03);});}catch(e){}}
const sfx={ok:()=>beep([660,880,1320],.09),bad:()=>beep([240,170],.17,'square',.06),tap:()=>beep([560],.035,'sine',.08),win:()=>beep([523,659,784,1046,1318],.12),hit:()=>beep([900,420,200],.07,'sawtooth',.07)};
$('#muteBtn').addEventListener('click',()=>{muted=!muted;$('#muteBtn').textContent=muted?'🔇':'🔊';});

/* ================= Sternenhimmel ================= */
(function(){const g=[ '','',''];for(let i=0;i<140;i++){const r=Math.random()<.15?1.6:1;g[i%3]+=`<circle cx="${(Math.random()*100).toFixed(2)}%" cy="${(Math.random()*100).toFixed(2)}%" r="${r}" fill="#fff"/>`;}
 $('#sky').innerHTML=`<svg width="100%" height="100%" style="position:absolute;top:0;left:0"><g opacity=".85">${g[0]}</g><g class="tw1">${g[1]}</g><g opacity=".45">${g[2]}</g></svg>`;})();

/* ================= Grafiken ================= */
const IKO=`<svg viewBox="12 12 76 76" class="iko" aria-label="Ikosaeder"><polygon points="71.4,40.8 63.5,85.9 94.9,58.2" fill="#7590ec" stroke="#eef1ff" stroke-width="1.2" stroke-linejoin="round"/><polygon points="71.4,40.8 63.5,85.9 26.7,58.2" fill="#8cd1f9" stroke="#eef1ff" stroke-width="1.2" stroke-linejoin="round"/><polygon points="71.4,40.8 77.4,13.5 35.3,13.5" fill="#6767e4" stroke="#eef1ff" stroke-width="1.2" stroke-linejoin="round"/><polygon points="71.4,40.8 77.4,13.5 94.9,58.2" fill="#6767e4" stroke="#eef1ff" stroke-width="1.2" stroke-linejoin="round"/><polygon points="71.4,40.8 35.3,13.5 26.7,58.2" fill="#7ea9f1" stroke="#eef1ff" stroke-width="1.2" stroke-linejoin="round"/><polygon points="63.5,85.9 64.7,86.5 22.6,86.5" fill="#83b7f4" stroke="#eef1ff" stroke-width="1.2" stroke-linejoin="round"/><polygon points="63.5,85.9 64.7,86.5 94.9,58.2" fill="#7080e9" stroke="#eef1ff" stroke-width="1.2" stroke-linejoin="round"/><polygon points="63.5,85.9 22.6,86.5 26.7,58.2" fill="#95e9fe" stroke="#eef1ff" stroke-width="1.2" stroke-linejoin="round"/><polygon points="35.3,13.5 26.7,58.2 5.1,41.8" fill="#7ea8f1" stroke="#eef1ff" stroke-width="1.2" stroke-linejoin="round"/><polygon points="22.6,86.5 26.7,58.2 5.1,41.8" fill="#8bcef9" stroke="#eef1ff" stroke-width="1.2" stroke-linejoin="round"/></svg>`;

length(){const v=ri(0,8);const L=(q,unit,ans,ex,ic)=>({type:'input',unit,prompt:`<span class="emoji">${ic}</span> Rechne um:<div class="bigtxt">${q} = ? ${unit}</div>`,answer:ans,hint:'1 m = 100 cm · 1 km = 1000 m · 1 kg = 1000 g · 1 € = 100 ct',explain:ex+`<br>Ergebnis: <b>${fmt(ans)} ${unit}</b>`});

 case 2:{const a=ri(1,9),b=pick([ri(1,9),ri(11,99),ri(101,999)]);return L(`${a} kg ${b} g`,'kg',a*1000+b,`1 g = 0,001 kg, also sind ${b} g = ${fmt(b)} kg.`,'⚖️');}

 default:{const d=ri(0,9)*1000+ri(1,99)*10;return L(`${fmtF(d,2)} €`,'ct',d/10*1000,`1 € = 100 ct. Das Komma rutscht 2 Stellen nach rechts.`,'💶');}}},

 if(t.type==='sort')drawSort();
 if(t.type==='tap')bindTap(t);
 if(boss){run.timeLeft=30;const tb=$('#tbar');timerId=setInterval(()=>{run.timeLeft=Math.max(0,run.timeLeft-0.1);if(tb){tb.style.width=(run.timeLeft/30*100)+'%';if(run.timeLeft<8)tb.style.background='var(--bad)';}if(run.timeLeft<=0)stopTimer();},100);}}

function answerUI(t){
 if(t.type==='input')return `<div class="display" id="disp"><span class="ph">?</span>${t.unit?`<span class="unit">${t.unit}</span>`:''}</div><div class="keypad">${['7','8','9','4','5','6','1','2','3',',','0','⌫'].map(k=>`<button class="key ${k===','?'comma':''} ${k==='⌫'?'del':''}" data-k="${k}">${k}</button>`).join('')}</div>`;
 if(t.type==='choice')return `<div class="choices ${t.cls||''}">${t.choices.map((c,i)=>`<button class="choice" data-c="${i}">${c.label}</button>`).join('')}</div>`;
 if(t.type==='sort')return `<div class="sortlbl"><span>${t.asc?'kleinste':'größte'} ➜</span><span>➜ ${t.asc?'größte':'kleinste'}</span></div><div class="slots" id="slots"></div><div class="pool" id="pool"></div><div class="muted center" style="font-size:15px">Tippe <b>alle</b> Zahlen der Reihe nach an, dann „Prüfen“. Antippen in der Reihe nimmt eine Zahl zurück.</div>`;
 return '';}
function updDisp(){const d=$('#disp');if(!d)return;const t=run.tasks[run.i];d.innerHTML=(cur.input?`<span>${cur.input}</span>`:'<span class="ph">?</span>')+(t.unit?`<span class="unit">${t.unit}</span>`:'');}
function key(k){if(cur.answered)return;let s=cur.input;if(k==='⌫')s=s.slice(0,-1);else if(k===','){if(!s.includes(','))s=(s||'0')+',';}else{if(s.replace(',','').length>=7)return;if(s.includes(',')&&s.split(',')[1].length>=3)return;s=s==='0'?k:s+k;}cur.input=s;updDisp();sfx.tap();}
function drawSort(){const t=run.tasks[run.i];$('#slots').innerHTML=cur.seq.length?cur.seq.map((idx,k)=>`<button class="tile" data-s="${k}">${t.items[idx].s}</button>`).join(`<span style="font-size:24px;color:var(--muted)">${t.asc?'<':'>'}</span>`):'<span class="ph">Hier entsteht deine Reihe …</span>';
 $('#pool').innerHTML=t.items.map((it,i)=>`<button class="tile ${cur.seq.includes(i)?'used':''}" data-t="${i}">${it.s}</button>`).join('');}
function bindTap(t){const svg=document.getElementById('tapline');if(!svg)return;const place=(cx)=>{if(cur.answered)return;const r=svg.getBoundingClientRect();if(!r.width)return;const px=(cx-r.left)/r.width*NL.W;let idx=Math.round((px-NL.x0)/(NL.x1-NL.x0)*t.nl.n);idx=Math.max(0,Math.min(t.nl.n,idx));cur.tap=idx;const m=document.getElementById('nlmark');if(m)m.innerHTML=flag(idx,t.nl.n,'#5ac8fa');sfx.tap();};
 svg.addEventListener('click',e=>place(e.clientX));
 svg.addEventListener('touchend',e=>{const tt=e.changedTouches&&e.changedTouches[0];if(tt){e.preventDefault();place(tt.clientX);}},{passive:false});}
function nudge(msg){const o=document.querySelector('.nudge');if(o)o.remove();const d=document.createElement('div');d.className='nudge';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>{if(d.parentNode)d.remove();},2800);}
window.addEventListener('error',e=>{nudge('⚠️ Technischer Fehler: '+(e.message||'unbekannt'));});
function shakeEl(sel){const el=$(sel);if(!el)return;el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');}

function check(){const t=run.tasks[run.i];if(cur.answered)return;let ok=false;
 if(t.type==='input'){const v=parseNum(cur.input);if(!cur.input){shakeEl('#disp');nudge('✏️ Tippe zuerst deine Antwort ins Zahlenfeld.');return;}if(isNaN(v)){shakeEl('#disp');nudge('Diese Eingabe ist keine gültige Zahl.');return;}ok=t.check?t.check(v):v===t.answer;}
 else if(t.type==='sort'){if(cur.seq.length<t.items.length){shakeEl('#slots');const f=t.items.length-cur.seq.length;nudge(`👆 Lege erst alle Zahlen in die Reihe – es ${f===1?'fehlt':'fehlen'} noch ${f}.`);return;}ok=cur.seq.every((idx,k)=>t.items[idx].v===t.order[k]);}
 else if(t.type==='tap'){if(cur.tap==null){shakeEl('#tapline');nudge('👆 Tippe zuerst auf den Zahlenstrahl, um deine Fahne zu setzen.');return;}ok=cur.tap===t.nl.target;const m=$('#nlmark');m.innerHTML=(ok?'':flag(cur.tap,t.nl.n,'#ff5d73'))+flag(t.nl.target,t.nl.n,'#3ddc97',fmt(t.nl.start+t.nl.step*t.nl.target));}
 resolve(ok);}
function choose(i){const t=run.tasks[run.i];if(cur.answered)return;const ok=t.choices[i].ok;document.querySelectorAll('.choice').forEach((b,k)=>{if(t.choices[k].ok)b.classList.add('right');else if(k===i)b.classList.add('wrong');});resolve(ok);}
function resolve(ok){cur.answered=true;stopTimer();const t=run.tasks[run.i];const boss=run.mode==='boss';let gain=0,extra='';run.res[run.i]=ok;
 if(ok){run.correct++;run.streak++;if(run.streak>S.bestCombo)S.bestCombo=run.streak;gain=(t.riddle?25:10)+Math.min(10,(run.streak-1)*2);
  if(boss&&run.timeLeft>0){gain+=5;extra='⚡ Tempo-Bonus! ';}
  if(t.riddle){S.riddles++;confetti(14);}
  if(boss){const dmg=run.streak>=3?2:1;run.hp=Math.max(0,run.hp-dmg);const f=$('.arena .bossfig');if(f){f.classList.add('hit');}const hb=$('#hpbar');if(hb)hb.style.width=(run.hp/run.maxhp*100)+'%';extra+=`💥 ${dmg} Schaden!`;sfx.hit();setTimeout(sfx.ok,180);}else sfx.ok();
 }else{run.streak=0;sfx.bad();if(boss){run.lives--;const l=$('#lives');if(l)l.innerHTML='❤️'.repeat(run.lives)+'🖤'.repeat(3-run.lives);extra='💔 Ein Herz verloren!';}}
 S.xp+=gain;save();
 if(run.streak===5)award('combo5');if(run.streak===10)award('combo10');if(S.riddles>=3)award('riddle3');
 const xv=$('#xpv');if(xv)xv.textContent=S.xp;const sk=$('#stk');if(sk){sk.textContent='🔥 '+run.streak;sk.classList.toggle('hot',run.streak>=3);}
 const praise=pick(['Richtig!','Volltreffer!','Super!','Stark!','Genau so!','Klasse!']);
 const sol=t.solution||(t.answer!=null?fmt(t.answer)+(t.unit?' '+t.unit:''):'');
 const el=document.createElement('div');el.className='sheet '+(ok?'ok':'bad');
 el.innerHTML=`<div class="sheet-in"><div class="fbtitle"><span>${ok?'✅ '+praise+(run.streak>=3?` 🔥 Combo ×${run.streak}`:''):'❌ Leider nicht.'}</span>${gain?`<span class="xp">+${gain} XP</span>`:''}</div>${extra?`<div class="sol">${extra}</div>`:''}${!ok&&t.type!=='choice'&&t.type!=='tap'?`<div class="sol">Richtig wäre: <b>${sol}</b></div>`:''}<div class="expl">${t.explain}</div><button class="btn go" data-a="next">Weiter ➜</button></div>`;
 document.body.appendChild(el);void el.offsetHeight;}
function hint(){const t=run.tasks[run.i];const hb=$('#hintbox');if(!hb||!hb.classList.contains('hidden'))return;hb.classList.remove('hidden');run.hintUsed=true;S.xp=Math.max(0,S.xp-5);save();const xv=$('#xpv');if(xv)xv.textContent=S.xp;const b=$('#hintBtn');if(b)b.disabled=true;}
function next(){if(run.mode==='boss'){if(run.hp<=0)return bossEnd(true);if(run.lives<=0)return bossEnd(false);run.tasks.push(bossTask(run.tasks.length));run.i++;return renderTask();}
 run.i++;if(run.i>=run.tasks.length)planetEnd();else renderTask();}

function planetEnd(){const P=run.P,c=run.correct,n=run.tasks.length;const st=c>=7?3:c>=5?2:c>=3?1:0;const wasUnl=bossUnlocked();S.stars[P.id]=Math.max(S.stars[P.id]||0,st);save();
 award('first');if(c===n)award('perfect');if(st===3&&!run.hintUsed)award('nohint');if(PLANETS.every(p=>S.stars[p.id]===3))award('allstars');
 const msg=st===3?'Fantastisch! Du hast den Planeten komplett erobert!':st===2?'Starke Leistung! Schaffst du beim nächsten Flug alle drei Sterne?':st===1?'Gelandet! Mit etwas Übung holst du mehr Sterne.':'Bruchlandung … Nutze die Tipps und versuch es nochmal!';
 if(st===3){sfx.win();confetti(40);}else if(st>0)sfx.win();
 prep();app.innerHTML=`<div class="result">${planetSVG(P,150)}<h1>Planet ${P.name} ${st?'erkundet!':''}</h1><div class="bigstars">${[1,2,3].map(k=>`<span class="${k<=st?'on':''}">★</span>`).join('')}</div>
 <div style="font-size:24px;margin:10px 0"><b>${c} von ${n}</b> richtig · <span style="color:var(--accent)">+${S.xp-run.xp0} XP</span></div><div class="muted" style="font-size:19px">${msg}</div>
 ${!wasUnl&&bossUnlocked()?'<div class="story center" style="border-color:#9a7bff">⚔️ <b>Der Kommadieb wurde entdeckt!</b> Auf der Sternenkarte kannst du ihn jetzt herausfordern.</div>':''}
 <div class="row"><button class="btn go" data-a="map">🗺️ Zur Sternenkarte</button><button class="btn" data-a="planet" data-p="${P.id}">🔁 Nochmal (neue Aufgaben)</button></div></div>`;run=null;window.scrollTo(0,0);}
function bossEnd(win){stopTimer();const gained=S.xp-run.xp0;
 if(win){S.xp+=50;S.bossWon=true;save();award('boss');sfx.win();confetti(50);}
 prep();app.innerHTML=`<div class="result">${win?`<div style="font-size:90px">🏆</div><h1>Der Kommadieb ist gefasst!</h1><div class="story">Alle Kommas sind zurück an ihrem Platz. Das Eis im Raumstations-Shop kostet wieder <b>3,05 €</b> – und die ganze Galaxie feiert dich, <b>${esc(S.name)}</b>! 🎉<br><br>Sieg-Bonus: <b>+50 XP</b> (insgesamt +${gained+50} XP in diesem Kampf)</div>`:`<div style="width:160px;margin:0 auto">${bossSVG()}</div><h1>Der Kommadieb ist entkommen …</h1><div class="story">„Hehe, bis zum nächsten Mal!“ – Lass dich nicht ärgern! Übe noch einmal auf einem Planeten oder fordere ihn direkt erneut heraus. (+${gained} XP gesammelt)</div>`}
 <div class="row">${win?'<button class="btn go" data-a="cert">📜 Zertifikat ansehen</button>':'<button class="btn go" data-a="boss">⚔️ Revanche!</button>'}<button class="btn" data-a="map">🗺️ Sternenkarte</button></div></div>`;run=null;window.scrollTo(0,0);}

function renderCert(){const rk=rankOf(S.xp);const totalStars=PLANETS.reduce((s,p)=>s+(S.stars[p.id]||0),0);
 let hsh=7;const str=S.name+'|'+S.xp+'|'+totalStars+'|'+S.badges.length+'|'+(S.bossWon?1:0);for(const ch of str)hsh=(hsh*31+ch.charCodeAt(0))%1679616;const code='MK-'+hsh.toString(36).toUpperCase().padStart(4,'0');
 prep();app.innerHTML=`<div class="cert"><div style="font-size:50px">🚀</div><h1>Weltraum-Zertifikat</h1><div style="font-size:19px">Hiermit wird bestätigt, dass</div><div style="font-size:36px;font-weight:800;margin:6px 0">${esc(S.name)}</div><div style="font-size:19px">an der <b>Mission Komma</b> teilgenommen und den Rang</div><div style="font-size:28px;font-weight:800;color:#7a4a00;margin:6px 0">${rk.name}</div><div style="font-size:19px">erreicht hat.</div>
 <table>${PLANETS.map(p=>`<tr><td>Planet ${p.name}</td><td>${'⭐'.repeat(S.stars[p.id]||0)||'–'}</td></tr>`).join('')}<tr><td>Kommadieb</td><td>${S.bossWon?'🏆 besiegt':'noch auf freiem Fuß'}</td></tr><tr><td>Abzeichen</td><td>${S.badges.map(b=>BADGES[b][0]).join(' ')||'–'} (${S.badges.length}/${Object.keys(BADGES).length})</td></tr><tr><td>Erfahrung</td><td><b>${S.xp} XP</b> · beste Combo: ${S.bestCombo}</td></tr></table>
 <div>${new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div><div class="code">${code}</div><div style="font-size:14px;margin-top:6px">Zeige dieses Zertifikat deiner Lehrkraft.</div>${FOOT}</div>
 <div class="row"><button class="btn go" data-a="map">🗺️ Zurück zur Karte</button></div>`;window.scrollTo(0,0);}

/* ================= Steuerung ================= */
function act(a,b){
 switch(a){
 case 'go':{const v=($('#nm')||{}).value;const name=(v||'').trim();if(!name){shakeEl('#nm');return;}S.name=name.slice(0,20);save();sfx.win();renderMap();break;}
 case 'map':if(run&&run.mode==='planet'&&run.i>0&&!confirm('Mission abbrechen? Dieser Flug wird nicht gewertet (XP bleiben).'))return;renderMap();break;
 case 'home':renderStart();break;
 case 'reset':if(confirm('Wirklich neu starten? Alle Sterne, XP und Abzeichen auf diesem iPad werden gelöscht.')){S=fresh();save();renderStart();}break;
 case 'planet':startPlanet(b.dataset.p);break;
 case 'boss':startBoss();break;
 case 'cert':renderCert();break;
 case 'check':check();break;
 case 'hint':hint();break;
 case 'next':next();break;}}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button');if(!b||b.id==='muteBtn')return;
 if(b.dataset.a)return act(b.dataset.a,b);
 if(b.dataset.k!=null)return key(b.dataset.k);
 if(b.dataset.c!=null)return choose(+b.dataset.c);
 if(b.dataset.t!=null){if(cur.answered)return;const i=+b.dataset.t;if(!cur.seq.includes(i)){cur.seq.push(i);sfx.tap();drawSort();}return;}
 if(b.dataset.s!=null){if(cur.answered)return;cur.seq.splice(+b.dataset.s,1);drawSort();return;}});
document.addEventListener('keydown',e=>{if(!run||!cur)return;if(e.target&&e.target.tagName==='INPUT')return;const t=run.tasks[run.i];
 if(cur.answered){if(e.key==='Enter'){e.preventDefault();next();}return;}
 if(t.type==='input'){if(/^[0-9]$/.test(e.key))key(e.key);else if(e.key===','||e.key==='.')key(',');else if(e.key==='Backspace'){e.preventDefault();key('⌫');}else if(e.key==='Enter')check();}
 else if(t.type==='choice'&&/^[1-4]$/.test(e.key)&&t.choices[+e.key-1])choose(+e.key-1);
 else if(e.key==='Enter')check();});

renderStart();
</script>
</body>
</html>
